name: Freeze old WordPress pages

on:
  workflow_dispatch:
  push:
    branches: [claude/archive-frozen-copy]
    paths: [scripts/snapshot-archive.py, .github/workflows/snapshot-archive.yml]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download every old page, slowly
        run: python3 scripts/snapshot-archive.py
      - name: Commit the frozen copy to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/__archive
          git commit -m "Frozen copy of the old cityage.com pages" || echo "nothing to commit"
          git push
